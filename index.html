<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#fbf5ec" />
<title>archypaint</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%2318181b%22/%3E%3Crect x=%226%22 y=%2217%22 width=%228.5%22 height=%228.5%22 rx=%221.8%22 stroke=%22%23e4e4e7%22 stroke-width=%221.8%22/%3E%3Cpath d=%22M14.5 21.25H16.5V10.75H17.5%22 stroke=%22%23e4e4e7%22 stroke-width=%221.8%22/%3E%3Crect x=%2217.5%22 y=%226.5%22 width=%228.5%22 height=%228.5%22 rx=%221.8%22 stroke=%22%23ff6f5e%22 stroke-width=%221.8%22 fill=%22%23ff6f5e%22 fill-opacity=%22.25%22/%3E%3C/svg%3E" />
<style>html{background:#fbf5ec}html[data-theme="dark"]{background:#18181b}</style>
<script>
  // resolve theme / background / frame before first paint (no flash); the app re-applies the same values from settings.ts
  try {
    var s = JSON.parse(localStorage.getItem("archypaint.settings.v1") || "{}"), q = new URLSearchParams(location.search);
    var t = q.get("theme") || s.theme || "system";
    var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
    var r = document.documentElement;
    r.dataset.theme = dark ? "dark" : "light"; r.dataset.bg = q.get("bg") || s.bg || "grid"; r.dataset.frame = s.frame === false ? "off" : "on";
  } catch (e) { /* defaults apply */ }
</script>
</head>
<body>
<div id="stage"><canvas id="static"></canvas><canvas id="live"></canvas></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
