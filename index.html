<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#fbf5ec" />
<title>archypaint</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c2412d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='5' width='18' height='14' rx='1.6'/%3E%3Cpath d='M3 9.7h18M3 14.3h18M9 5v14'/%3E%3C/svg%3E" />
<style>html{background:#fbf5ec}html[data-theme="dark"]{background:#18181b}</style>
<script>
  // resolve theme / background / frame before first paint (no flash); the app re-applies the same values from settings.ts
  try {
    var s = JSON.parse(localStorage.getItem("archypaint.settings.v1") || "{}"), q = new URLSearchParams(location.search);
    var t = q.get("theme") || s.theme || "system";
    var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
    var r = document.documentElement;
    r.dataset.theme = dark ? "dark" : "light"; r.dataset.bg = q.get("bg") || s.bg || "grid"; r.dataset.frame = s.frame === false ? "off" : "on";
  } catch (e) { /* defaults apply */ }
</script>
</head>
<body>
<div id="stage"><canvas id="static"></canvas><canvas id="live"></canvas></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
